exec = gsettings set org.gnome.desktop.interface gtk-theme 'Wallbash-Gtk'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    col.active_border = rgba(D4CCC7ff) rgba(523829ff) 45deg
    col.inactive_border = rgba(2C101Dff) rgba(774051ff) 45deg
}

group {
    col.border_active = rgba(D4CCC7ff) rgba(523829ff) 45deg
    col.border_inactive = rgba(2C101Dcc) rgba(774051cc) 45deg
    col.border_locked_active = rgba(101111ff) rgba(080808ff) 45deg
    col.border_locked_inactive = rgba(FFFFFFcc) rgba(FFFFFFcc) 45deg
}
