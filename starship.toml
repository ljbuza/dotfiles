"$schema" = 'https://starship.rs/config-schema.json'

format = "$os$directory$git_branch$git_status$line_break$character"
right_format = "$username$dart$python$time"

add_newline = false

[os]
disabled = false
format = '[$symbol](cyan) '

[os.symbols]
Windows = '󰍲'
Ubuntu = '󰕈'
SUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = '󰀵'
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
Arch = '󰣇'
Artix = '󰣇'
EndeavourOS = ''
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'

[directory]
style = 'cyan'
format = '[ $path ]($style)'
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ''
style = '#F1502F'
format = '[:: $branch]($style)'

[git_status]
style = '#F1502F'
format = '[ $all_status$ahead_behind]($style)'
conflicted = '= '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = '?${count} '
stashed = '*${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

[username]
show_always = false
style_root = 'red'
format = '[| root ]($style)'
disabled = false

[dart]
disabled = false
symbol = ''
style = '#06A4CE'
format = '[| $symbol $version ]($style)'

[python]
detect_extensions = []
detect_files = []
detect_folders = []
style = '#4584b6'
format = '[|  ${virtualenv} ]($style)'

[time]
disabled = false
time_format = '%R'
style = 'green'
format = '[| $time ]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[➜](bold red) '
vimcmd_symbol = '[➜](bold green) '
